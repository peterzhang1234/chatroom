{% extends 'base.html' %}

{% block title %}首页 - WebSocket 聊天室{% endblock %}

{% block content %}
<div class="card-form" style="max-width: 520px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="text-center mb-3">您好，{{ user.username }}！</h4>

      {% if rooms %}
      <div class="mb-3">
        <p class="text-muted mb-2">已有房间：</p>
        <div class="d-flex flex-wrap gap-2">
          {% for room in rooms %}
          <a href="/chat/{{ room }}/" class="btn btn-outline-secondary btn-sm">{{ room }}</a>
          {% endfor %}
        </div>
      </div>
      <hr>
      {% endif %}

      <p class="mb-2">输入房间名称进入或创建：</p>
      <div class="input-group">
        <input id="room-name-input" type="text" class="form-control" placeholder="房间名称" autocomplete="off">
        <button id="room-name-submit" type="button" class="btn btn-primary">进入</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  var input = document.getElementById('room-name-input');
  var btn = document.getElementById('room-name-submit');

  function enterRoom() {
    var name = input.value.trim();
    if (name) {
      window.location.pathname = '/chat/' + encodeURIComponent(name) + '/';
    }
  }

  btn.addEventListener('click', enterRoom);
  input.addEventListener('keyup', function(e) {
    if (e.key === 'Enter') enterRoom();
  });
  input.focus();
})();
</script>
{% endblock %}
