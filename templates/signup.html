{% extends 'base.html' %}

{% block title %}注册 - WebSocket 聊天室{% endblock %}

{% block content %}
<div class="card-form">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4">注册账户</h4>

      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
          <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
          {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100 mb-3">注册</button>
      </form>

      <p class="text-center mb-0">
        已有账号？<a href="{% url 'login' %}">去登录</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
