{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WebSocket 聊天室{% endblock %}</title>
  <link rel="shortcut icon" href="{% static "images/webchat.png" %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static "css/style.css" %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">WebSocket 聊天室</a>
      <div class="ms-auto">
        {% if user.is_authenticated %}
          <span class="navbar-text me-3">{{ user.username }}</span>
          <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">注销</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">登录</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted py-3 border-top">
    <small>WebSocket 聊天室 &middot; Django Channels 学习项目</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
